name: Publish

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.10"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Read project version
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Project version must be semver without a leading v, got: $VERSION" >&2
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Check exported version
        run: |
          PACKAGE_VERSION="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/unleash_openfeature_python_provider/_version.py | head -n 1)"

          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "_version.py version $PACKAGE_VERSION does not match project version $VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Test
        run: uv run pytest

      - name: Build
        run: uv build

      - name: Check tag does not exist
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin" >&2
            exit 1
          fi

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Publish to PyPI
        run: uv publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes

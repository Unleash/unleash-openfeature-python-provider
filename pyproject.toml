[project]
name = "unleash-openfeature-python-provider"
version = "0.1.0-alpha.2"
description = "Python provider for Unleash and OpenFeature."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openfeature-sdk>=0.10.0",
    # Needs the release that adds the `sdk_flavor` / `sdk_flavor_version`
    "unleashclient>=6.7.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pytest>=8.0.0",
    "ruff>=0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.uv]
package = true
